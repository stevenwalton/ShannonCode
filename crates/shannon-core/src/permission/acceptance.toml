# The permission ACCEPTANCE SUITE — what the rules must decide, by Steven's
# goals (2026-10-08), as cases the engine is measured against.
#
# Each case: the INTENT in prose, the policy as TODAY's grammar spells it
# (`rules`; left out where today's grammar cannot say it), the command line,
# and the verdict the GOALS call for. `gap` records where today's engine does
# not decide that, and why, with `today` saying what it decides instead
# (`allow` `ask` `deny`, or `unspellable` where the rules cannot be said); the
# harness (`acceptance.rs`) fails when a gap closes unnoticed, moves, or a new
# one opens. `needs` names what the verdict assumes exists (a program model, a
# web category) beyond the grammar.
#
# An `allow` case's allows (a `deny` case's denies) must be what decide it:
# without them the engine decides otherwise, or the case says
# `rules_matter = false` and why (its point is that other rules do not reach
# it). 12 allow cases held with no rule at all (review stop 12, T8 H3).
#
# Verdicts: `allow`, `ask`, `deny`, or `not-allow` where either refusal meets
# the intent. Every case starts in `defaults.start` with the shipped rules
# unless it says `base = "empty"`.
#
# Examples are benign on purpose (`rm build/x`, `gh pr close 12`): the point
# is the shape, not the damage.
#
# Goals: G1 fewer false prompts, no more false allows · G2 global + project
# rules · G3 users model programs, shipped models in the same format · G4
# allow/ask/deny on a program, subcommand, flag, flag value · G5 programs,
# paths, web under one grammar · G6 paths recursive, most specific wins · G7
# allowed program never acts on a denied path · G8 rules compound · G9 one
# grammar, or simple + advanced tiers.

[defaults]
start = "/home/me/proj"
base = "defaults"

# ---------------------------------------------------------------------------
# A. The named examples (G4)
# ---------------------------------------------------------------------------

[[case]]
id = "find-without-delete-runs"
goals = ["G4"]
intent = "deny any find that has -delete: a find without it is the read it always was"
rules = ["deny find:-delete"]
command = "find . -name '*.md'"
expect = "allow"

[[case]]
id = "find-delete-denied"
goals = ["G4"]
intent = "deny any find that has -delete"
rules = ["deny find:-delete"]
command = "find . -name '*.md' -delete"
expect = "deny"

[[case]]
id = "find-delete-denied-whatever-the-order"
goals = ["G4"]
intent = "the flag's position does not matter"
rules = ["deny find:-delete"]
command = "find . -delete -name '*.md'"
expect = "deny"

[[case]]
id = "find-delete-denied-under-a-blanket-allow"
goals = ["G4", "G8"]
intent = "a deny on a flag outranks an allow of the program"
rules = ["allow find *", "deny find:-delete"]
command = "find . -name '*.md' -delete"
expect = "deny"

[[case]]
id = "ls-blanket"
goals = ["G4"]
intent = "allow any ls — a flag ls's model does not know as well"
rules = ["allow ls *"]
command = "ls --hyperlink=always src"
expect = "allow"

[[case]]
id = "ls-blanket-outside-the-approved-places"
goals = ["G4", "G5", "G7"]
intent = "allow any ls — but a path is its own category: outside the approved places it still asks"
rules = ["allow ls *"]
command = "ls -la /etc"
expect = "ask"

[[case]]
id = "gh-pr-view-allowed"
goals = ["G4", "G8"]
intent = "under an ask of every gh, allow any gh pr view: the subcommand outranks the program"
rules = ["ask gh *", "allow gh pr view *"]
command = "gh pr view 123"
expect = "allow"

[[case]]
id = "gh-pr-view-allowed-with-any-flag"
goals = ["G4"]
intent = "a blanket-allowed subcommand takes any flag (Steven, Q2)"
rules = ["ask gh *", "allow gh pr view *"]
command = "gh pr view 123 --comments --json title"
expect = "allow"

[[case]]
id = "gh-pr-view-is-not-gh-pr-close"
goals = ["G4"]
intent = "the words name a SUBCOMMAND, in position — not a set of words anywhere"
rules = ["ask gh *", "allow gh pr view *"]
command = "gh pr close 12 --comment view"
expect = "ask"

[[case]]
id = "gh-pr-view-is-not-gh-view-pr"
goals = ["G4"]
intent = "order is structure"
rules = ["ask gh *", "allow gh pr view *"]
command = "gh view pr 12"
expect = "ask"

[[case]]
id = "gh-pr-create-denied"
goals = ["G4"]
intent = "deny any gh pr create"
rules = ["ask gh *", "allow gh pr view *", "deny gh pr create"]
command = "gh pr create --title x --body y"
expect = "deny"

[[case]]
id = "gh-pr-view-of-a-branch-named-create"
goals = ["G4"]
intent = "a deny names a subcommand, not a word: viewing the PR of branch `create` is a view"
rules = ["ask gh *", "allow gh pr view *", "deny gh pr create"]
command = "gh pr view create"
expect = "allow"

[[case]]
id = "gh-api-get-allowed"
goals = ["G4", "G8"]
intent = "under an ask of every gh api, allow gh api --method GET: the specific form outranks the blanket"
rules = ["ask gh api *", "allow gh api --method=GET *", "deny gh api --method=POST", "ask gh api -H"]
command = "gh api --method GET repos/o/r/pulls"
expect = "allow"

[[case]]
id = "gh-api-get-allowed-equals-spelling"
goals = ["G4"]
intent = "`--method=GET` and `--method GET` are one spelling"
rules = ["ask gh api *", "allow gh api --method=GET *", "deny gh api --method=POST", "ask gh api -H"]
command = "gh api --method=GET repos/o/r/pulls"
expect = "allow"

[[case]]
id = "gh-api-get-short-spelling"
goals = ["G3", "G4"]
intent = "`-X GET` is `--method GET` — once gh's model says so"
needs = ["model:gh"]
rules = ["ask gh api *", "allow gh api --method=GET *", "deny gh api --method=POST", "ask gh api -H"]
command = "gh api -X GET repos/o/r/pulls"
expect = "allow"

[[case]]
id = "gh-api-post-denied"
goals = ["G4"]
intent = "deny gh api --method POST"
rules = ["ask gh api *", "allow gh api --method=GET *", "deny gh api --method=POST", "ask gh api -H"]
command = "gh api --method POST repos/o/r/issues"
expect = "deny"

[[case]]
id = "gh-api-post-denied-short-spelling"
goals = ["G3", "G4"]
intent = "a deny must hold under every spelling the model knows"
needs = ["model:gh"]
rules = ["ask gh api *", "allow gh api --method=GET *", "deny gh api --method=POST", "ask gh api -H"]
command = "gh api -X POST repos/o/r/issues"
expect = "deny"

[[case]]
id = "gh-api-implicit-post-denied"
goals = ["G3", "G4"]
intent = "gh api with a field (-f) sends POST with no --method written; the model must know (to verify against gh's docs)"
needs = ["model:gh"]
rules = ["ask gh api *", "allow gh api --method=GET *", "deny gh api --method=POST", "ask gh api -H"]
command = "gh api repos/o/r/issues -f title=x"
expect = "deny"

[[case]]
id = "gh-api-header-asks-even-with-get"
goals = ["G4", "G8"]
intent = "ask on every gh api -H: an ask outranks the allow it sits beside"
rules = ["ask gh api *", "allow gh api --method=GET *", "deny gh api --method=POST", "ask gh api -H"]
command = "gh api --method GET -H 'Accept: application/json' repos/o/r"
expect = "ask"

[[case]]
id = "gh-api-no-method-is-a-specific-form-not-written"
goals = ["G4", "G3"]
intent = "a plain `gh api X` is a GET, which gh's model knows: a read, allowed by the model's default (Steven, 10-09, Q1: model-centric)"
needs = ["model:gh"]
rules = ["allow gh api --method=GET *", "deny gh api --method=POST", "ask gh api -H"]
command = "gh api repos/o/r/pulls"
expect = "allow"
# The model's default allows it, the allow beside it naming a form not written;
# with the group's `ask gh api *` it would ask, as a rule of yours should.
rules_matter = false

# ---------------------------------------------------------------------------
# B. Compounding (G8): under an ask of every find, allow -name, allow -iname,
#    deny -delete — so the allows are what let a find run (T8 H3: without the
#    ask, a find is a read and the allows decided nothing)
# ---------------------------------------------------------------------------

[[case]]
id = "compound-two-allowed-flags"
goals = ["G8"]
intent = "allow find -name and allow find -iname together cover a find with both"
rules = ["ask find *", "allow find:-name", "allow find:-iname", "deny find:-delete"]
command = "find . -name '*.md' -iname foobar.c"
expect = "allow"

[[case]]
id = "compound-denied-flag-added"
goals = ["G8"]
intent = "add -delete and the deny wins"
rules = ["ask find *", "allow find:-name", "allow find:-iname", "deny find:-delete"]
command = "find . -name '*.md' -iname foobar.c -delete"
expect = "deny"

[[case]]
id = "compound-unmentioned-flag-rides-on-the-model"
goals = ["G8", "G3"]
intent = "a flag no rule names, which find's model marks benign (-L), rides on the allows because the call only reads (Steven, 10-09, Q1: model-centric for a modelled program; narrowed 10-10 to calls that only read — see specific-form-unnamed-flag-asks-past-a-read; an unmodelled program's unknown flag asks — see specific-form-unknown-flag-asks)"
rules = ["ask find *", "allow find:-name", "allow find:-iname", "deny find:-delete"]
command = "find . -name '*.md' -L"
expect = "allow"
by = "rule"

[[case]]
id = "compound-shipped-carving-still-asks"
goals = ["G8"]
intent = "a shipped ask (find -exec) is not answered by allows of other flags"
rules = ["ask find *", "allow find:-name", "allow find:-iname", "deny find:-delete"]
command = "find . -name '*.md' -exec cat {} \\;"
expect = "ask"

[[case]]
id = "compound-flagless-find-is-a-read"
goals = ["G8"]
intent = "a find naming no flag is the read it is, inside the project: allows of other forms do not make it ask"
rules = ["allow find:-name", "allow find:-iname", "deny find:-delete"]
command = "find src"
expect = "allow"
# Without the section's `ask find *`: its point is that the allows beside it
# do not reach it, so the model's default decides.
rules_matter = false

# ---------------------------------------------------------------------------
# C. Paths (G5, G6, G7, Q5): recursive, most specific wins, with an operation
# ---------------------------------------------------------------------------

[[case]]
id = "path-deny-is-recursive"
goals = ["G6"]
intent = "denying /etc/ denies /etc/foo/bar/baz"
rules = ["deny * /etc/**"]
command = "cat /etc/foo/bar/baz"
expect = "deny"

[[case]]
id = "path-deny-named-as-a-directory"
goals = ["G6"]
intent = "a directory names what is below it: `/etc` written without `**` still holds"
rules = ["deny * /etc"]
command = "cat /etc/hosts"
expect = "deny"

[[case]]
id = "path-specific-allow-under-broad-deny"
goals = ["G6"]
intent = "deny /mnt/ but allow /mnt/foo/: /mnt/foo is usable"
rules = ["deny * /mnt/**", "allow * /mnt/foo/**"]
command = "cat /mnt/foo/a.txt"
expect = "allow"

[[case]]
id = "path-specific-allow-leaves-the-rest-denied"
goals = ["G6"]
intent = "deny /mnt/ but allow /mnt/foo/: /mnt/bar stays denied"
rules = ["deny * /mnt/**", "allow * /mnt/foo/**"]
command = "cat /mnt/bar/a.txt"
expect = "deny"

[[case]]
id = "path-a-deeper-deny-wins-again"
goals = ["G6"]
intent = "deny /mnt, allow /mnt/foo, deny /mnt/foo/secret: the deepest rule decides"
rules = ["deny * /mnt/**", "allow * /mnt/foo/**", "deny * /mnt/foo/secret/**"]
command = "cat /mnt/foo/secret/a.txt"
expect = "deny"

[[case]]
id = "path-denied-beats-allowed-program"
goals = ["G7"]
intent = "a program with allowed arguments cannot act on a denied path"
rules = ["allow rm *", "deny * ~/important/**"]
command = "rm ~/important/notes.txt"
expect = "deny"

[[case]]
id = "path-denied-beats-allowed-program-find"
goals = ["G7"]
intent = "the same with a read: find may be allowed, the place is not"
rules = ["allow find *", "deny * ~/private/**"]
command = "find ~/private -name '*.md'"
expect = "deny"

[[case]]
id = "path-allowed-program-inside-the-project"
goals = ["G7"]
intent = "inside the project, an allowed rm still asks: a delete needs a place granted (`allow :delete build`, or `allow rm build/*`) — a program allow grants no place (Steven, 10-09, Q7)"
rules = ["allow rm *", "deny * ~/important/**"]
command = "rm build/out.o"
expect = "ask"

[[case]]
id = "path-read-grant-covers-a-read"
goals = ["Q5"]
intent = "a read grant on a place covers a read there"
rules = ["allow :read /srv/data/**"]
command = "cat /srv/data/a.csv"
expect = "allow"

[[case]]
id = "path-read-grant-does-not-cover-a-write"
goals = ["Q5"]
intent = "a read grant does not cover a write to the same place"
rules = ["allow :read /srv/data/**"]
command = "cat notes.txt > /srv/data/a.csv"
expect = "ask"

[[case]]
id = "path-read-grant-does-not-cover-a-delete"
goals = ["Q5"]
intent = "nor a delete"
rules = ["allow :read /srv/data/**"]
command = "rm /srv/data/a.csv"
expect = "ask"

[[case]]
id = "path-write-grant-covers-a-redirect"
goals = ["Q5"]
intent = "a write grant covers a redirect into the place — outside the project, where a write asks without it (inside, one runs anyway: T8 H3)"
rules = ["allow :write /srv/out/**"]
command = "echo hi > /srv/out/log"
expect = "allow"

[[case]]
id = "path-write-grant-covers-mkdir"
goals = ["Q5", "G3"]
intent = "a write grant covers a writer — once the writer is modelled"
needs = ["model:mkdir"]
rules = ["allow :write build/**"]
command = "mkdir build/x"
expect = "allow"

[[case]]
id = "path-write-grant-does-not-approve-a-flag"
goals = ["Q5", "G4"]
intent = "the path rule grants the place; only a program rule approves a writer's flags (Steven, 10-10) — else adding `allow mkdir` would make `mkdir -p` stricter than no rule"
needs = ["model:mkdir"]
rules = ["allow :write build/**"]
command = "mkdir -p build/x"
expect = "ask"

[[case]]
id = "path-write-grant-with-the-flag-approved"
goals = ["Q5", "G4"]
intent = "the flag approved by a program rule, the place by the path rule"
needs = ["model:mkdir"]
rules = ["allow mkdir -p", "allow :write build/**"]
command = "mkdir -p build/x"
expect = "allow"

[[case]]
id = "path-grant-follows-a-cd"
goals = ["G6"]
intent = "a grant holds where the line's cd put the command"
rules = ["allow :read ~/notes/**"]
command = "cd ~/notes && cat a.md"
expect = "allow"

[[case]]
id = "path-grant-does-not-cover-a-climb"
goals = ["G6"]
intent = "a `..` out of the granted place is not in it"
rules = ["allow :read ~/notes/**"]
command = "cat ~/notes/../private/a.md"
expect = "ask"

[[case]]
id = "path-default-read-inside-project"
goals = ["G1"]
intent = "with no rule at all, a read inside the project runs"
rules = []
command = "cat src/main.rs"
expect = "allow"

[[case]]
id = "path-default-read-outside-asks"
goals = ["G1"]
intent = "with no rule, a read outside the project asks (Steven, 10-05)"
rules = []
command = "cat /etc/hosts"
expect = "ask"

[[case]]
id = "path-default-read-of-a-sibling-asks"
goals = ["G1"]
intent = "a sibling directory is outside"
rules = []
command = "cat ../other-project/README.md"
expect = "ask"

# ---------------------------------------------------------------------------
# D. Blanket allow vs specific forms (Steven, Q2)
# ---------------------------------------------------------------------------

[[case]]
id = "blanket-program-takes-any-flag"
goals = ["G4"]
intent = "a blanket-allowed program takes any flag"
rules = ["allow cargo *"]
command = "cargo build --release --target-dir build/alt"
expect = "allow"

[[case]]
id = "blanket-program-does-not-grant-a-place"
goals = ["G4", "G7"]
intent = "a blanket program allow decides the program, not where it may act: a flag naming a place outside the project asks"
rules = ["allow cargo *"]
command = "cargo build --release --target-dir /srv/out"
expect = "ask"

[[case]]
id = "blanket-program-any-subcommand"
goals = ["G4"]
intent = "a blanket allow covers every subcommand"
rules = ["allow cargo *"]
command = "cargo test -- --nocapture"
expect = "allow"

[[case]]
id = "specific-form-exact"
goals = ["G4"]
intent = "allow cargo test, nothing more: the exact form runs"
rules = ["allow cargo test"]
command = "cargo test"
expect = "allow"

[[case]]
id = "specific-form-unknown-flag-asks"
goals = ["G4"]
intent = "a flag neither the form nor the model knows asks (Q2: where only forms are allowed, an unknown flag asks)"
rules = ["allow cargo test"]
command = "cargo test --frobnicate"
expect = "ask"

[[case]]
id = "specific-form-unnamed-flag-asks-past-a-read"
goals = ["G4", "G3"]
intent = "past a read, a rule says which flags it approved: a flag the form does not name asks, harmless or not (Steven, 10-10: `allow rm` is not `rm -rf`; on a call that only reads it still rides — compound-unmentioned-flag-rides-on-the-model)"
rules = ["allow cargo test"]
command = "cargo test --workspace"
expect = "ask"

[[case]]
id = "specific-form-named-flag-allows-past-a-read"
goals = ["G4"]
intent = "the same call, the flag named: the form approves it"
rules = ["allow cargo test --workspace"]
command = "cargo test --workspace"
expect = "allow"

[[case]]
id = "specific-form-writer-takes-only-the-flags-it-names"
goals = ["G4", "G8"]
intent = "`allow rm` approves `rm x`, not `rm -rf x`; `allow rm *` approves any flag, the place still judged by path rules (Steven, 10-10)"
rules = ["allow rm", "allow :delete build"]
command = "rm -rf build/x"
expect = "ask"

[[case]]
id = "specific-form-writer-blanket-takes-any-flag"
goals = ["G4"]
intent = "the blanket: any flag, the place judged by its path rule"
rules = ["allow rm *", "allow :delete build"]
command = "rm -rf build/x"
expect = "allow"

[[case]]
id = "specific-form-writer-without-flags-allows"
goals = ["G4"]
intent = "the premise of the two above: the form with no flags covers the call with none"
rules = ["allow rm", "allow :delete build"]
command = "rm build/x"
expect = "allow"

[[case]]
id = "specific-form-other-subcommand-asks"
goals = ["G4"]
intent = "another subcommand asks"
rules = ["allow cargo test"]
command = "cargo build"
expect = "ask"

[[case]]
id = "subcommand-with-star-takes-any-flag"
goals = ["G4"]
intent = "allow cargo test * — the subcommand with any arguments"
rules = ["allow cargo test *"]
command = "cargo test --workspace -- --nocapture"
expect = "allow"

[[case]]
id = "subcommand-with-star-is-positional"
goals = ["G4"]
intent = "`cargo build test` is a build (of the `test` target), not a test"
rules = ["allow cargo test *"]
command = "cargo build test"
expect = "ask"

# ---------------------------------------------------------------------------
# E. Prefix structure: a subcommand's form against its program's (probed
#    10-07, when these programs were unmodelled; git and uv are modelled
#    since — the forms hold either way)
# ---------------------------------------------------------------------------

[[case]]
id = "prefix-git-status-allowed"
goals = ["G4"]
intent = "under an ask of every git, allow git status: the subcommand's prefix outranks the program's"
rules = ["ask git *", "allow git status *"]
command = "git status --short"
expect = "allow"

[[case]]
id = "prefix-git-status-does-not-allow-push"
goals = ["G4"]
intent = "a push naming a branch called `status` is a push"
rules = ["allow git status *"]
command = "git push --force origin status"
expect = "ask"

[[case]]
id = "prefix-git-in-another-repository-asks"
goals = ["G4", "G7"]
intent = "`-C` before the subcommand points git at another place, which is outside"
rules = ["allow git status *"]
command = "git -C ../other-project status"
expect = "ask"

[[case]]
id = "prefix-uv-run-pytest-allowed"
goals = ["G4"]
intent = "allow uv run pytest with any arguments"
rules = ["allow uv run pytest *"]
command = "uv run pytest -x tests/test_a.py"
expect = "allow"

[[case]]
id = "prefix-uv-run-with-an-option-between-asks"
goals = ["G4"]
intent = "`--with` between `run` and `pytest` changes what runs: not the form that was allowed"
rules = ["allow uv run pytest *"]
command = "uv run --with requests pytest tests/test_a.py"
expect = "ask"

[[case]]
id = "prefix-uv-run-python-is-not-pytest"
goals = ["G4"]
intent = "`uv run python -c … pytest` runs python; the word `pytest` later is an argument"
rules = ["allow uv run pytest *"]
command = "uv run python -c 'print(1)' pytest"
expect = "ask"

[[case]]
id = "prefix-uv-words-out-of-order"
goals = ["G4"]
intent = "the same words in another order are another command"
rules = ["allow uv run pytest *"]
command = "uv pytest run tests/test_a.py"
expect = "ask"

[[case]]
id = "prefix-uv-run-another-program-is-not-pytest"
goals = ["G4"]
intent = "`uv run ls pytest` runs ls — a read that allows on its own — under uv's sync; the rule named pytest, there (Steven, 10-27: order matters)"
rules = ["allow uv run pytest *"]
command = "uv run ls pytest"
expect = "ask"

[[case]]
id = "prefix-uv-run-another-subcommand-is-not-the-one-named"
goals = ["G4"]
intent = "the rule names `git status` inside `uv run`: `git log`, a read, is another command"
rules = ["allow uv run git status"]
command = "uv run git log"
expect = "ask"

[[case]]
id = "prefix-uv-run-the-subcommand-named"
goals = ["G4"]
intent = "the inner command the rule names, in its order, is allowed"
rules = ["allow uv run git status"]
command = "uv run git status"
expect = "allow"

# ---------------------------------------------------------------------------
# F. A trailing `*` and a path word (decided 10-07: PRESENCE)
# ---------------------------------------------------------------------------

[[case]]
id = "star-path-word-is-not-decorative"
goals = ["G4", "G7"]
intent = "`allow rm *` beside `allow :delete build/*` does not allow an rm that touches nothing under build (the place is the path rule's, Steven 10-10)"
rules = ["allow rm *", "allow :delete build/*"]
command = "rm notes/a.txt"
expect = "ask"

[[case]]
id = "star-path-word-present-with-another"
goals = ["G4", "G7"]
intent = "a file under build beside one outside the grant: the second is a delete nothing grants (Steven, 10-09, Q7 — reverses the 10-07 reading, under which the weird sequence was allowed)"
rules = ["allow rm *", "allow :delete build/*"]
command = "rm build/a.o notes/a.txt"
expect = "ask"

[[case]]
id = "star-rule-ends-where-a-command-does"
goals = ["G4"]
intent = "two commands are judged apart: the second names nothing under build"
rules = ["allow rm *", "allow :delete build/*"]
command = "rm build/a.o; rm notes/a.txt"
expect = "ask"

# ---------------------------------------------------------------------------
# G. What runs: programs by path, functions, PATH, privilege
# ---------------------------------------------------------------------------

[[case]]
id = "script-by-path-is-an-exec-of-a-file"
goals = ["G5", "Q5"]
intent = "running a script in ./scripts is executing a file there — a path rule with an exec operation"
needs = ["grammar:exec-operation"]
rules = ["allow :exec ./scripts"]
command = "./scripts/build.sh --fast"
expect = "allow"

[[case]]
id = "program-by-path-is-not-the-named-program"
goals = ["G4"]
intent = "`allow ls` names the ls on the trusted PATH; `/bin/ls` is a file, judged as one"
rules = ["allow ls *"]
command = "/bin/ls -la"
expect = "ask"

[[case]]
id = "program-in-home-bin-is-not-the-named-program"
goals = ["G4"]
intent = "nor is a same-named file in ~/.local/bin"
rules = ["allow ls *"]
