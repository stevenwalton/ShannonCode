id = "q-unmodelled-flag-is-found-anywhere"
goals = ["G4"]
intent = "an unmodelled allow's flag is present anywhere, as a person reads the rule; a flag's position says nothing the gate can use without a model (Steven, 10-10)"
rules = ["allow make test --jobs=4 *"]
command = "make --jobs=4 test"
expect = "allow"

[[case]]
id = "q-unmodelled-flag-spelling-is-literal"
goals = ["G4", "G3"]
intent = "without a model, another spelling of the option is another word: the rule's note says so"
rules = ["allow make test --jobs=4 *"]
command = "make test -j4"
expect = "ask"

[[case]]
id = "q-unmodelled-deny-beside-an-allow"
goals = ["G4", "G8"]
intent = "a deny on an unmodelled program's flag is met by contact, beside an allow of another flag"
rules = ["allow make test *", "deny make --always-make"]
command = "make test --always-make"
expect = "deny"

[[case]]
id = "q-stream-fed-argv-asks"
goals = ["G1"]
intent = "xargs runs a program on words the gate never sees"
rules = []
command = "ls | xargs rm"
expect = "ask"

[[case]]
id = "q-project-write-grant-leaves-the-harness-guard"
goals = ["G6"]
intent = "a write grant on the project does not lift the shipped guard on .claude/ (Q13)"
rules = ["allow :write ."]
command = "echo x > .claude/settings.json"
expect = "ask"

[[case]]
id = "q-a-named-write-grant-lifts-the-harness-guard"
goals = ["G6"]
intent = "a grant naming .claude lifts its guard: a soft ask (Q13)"
rules = ["allow :write .claude"]
command = "echo x > .claude/settings.json"
expect = "allow"

[[case]]
id = "q-unknown-gh-word-runs-an-extension"
goals = ["G4"]
intent = "an unknown first word under gh runs gh-<word>, a program the blanket does not cover"
rules = ["allow gh *"]
command = "gh x"
expect = "ask"
needs = ["model:gh"]

[[case]]
id = "q-delete-grant-covers-the-tree-itself"
goals = ["G6", "G7"]
intent = "a delete grant on a tree covers deleting the tree"
rules = ["allow rm *", "allow :delete build"]
command = "rm -r build"
expect = "allow"

[[case]]
id = "q-delete-grant-does-not-climb-out"
goals = ["G6", "G7"]
intent = "a climb out of the granted tree is not granted"
rules = ["allow rm *", "allow :delete build"]
command = "rm -r build/.."
expect = "ask"

[[case]]
id = "q-program-rule-path-word-is-an-argument"
goals = ["G7"]
intent = "a path word on an allow is an argument the command must carry, never a grant: the delete still asks (Steven, 10-10: program rules are about arguments and flags, path rules about access; reverses the scoped grant of 10-09)"
rules = ["allow rm build/a.o"]
command = "rm build/a.o"
expect = "ask"

[[case]]
id = "q-a-place-is-granted-by-a-path-rule"
goals = ["G5", "G7"]
intent = "the place a program rule cannot grant, a path rule does"
rules = ["allow rm", "allow :delete build/*"]
command = "rm build/a.o"
expect = "allow"

[[case]]
id = "q-scoped-grant-names-what-is-in-the-tree-not-the-tree"
goals = ["G6"]
intent = "`build/*` names what is in build, not build itself"
rules = ["allow rm -r", "allow :delete build/*"]
command = "rm -r build"
expect = "ask"

[[case]]
id = "q-exec-grant-covers-the-program-not-its-words"
goals = ["G7"]
intent = "an exec grant covers running the file; a word outside the project still asks"
rules = ["allow :exec ./scripts"]
command = "./scripts/build.sh --fast /etc/hosts"
expect = "ask"

# ---- the calls made in the switch, pinned (review 2026-10-10, C) ----------

[[case]]
id = "r-double-star-on-an-allow-grants-no-place"
goals = ["G6"]
intent = "`**` after a program once granted its paths anywhere; places are path rules' now (Steven, 10-10), so on an allow it is `*` — see r-a-grant-of-every-place"
rules = ["allow rm **"]
command = "rm /etc/hosts"
expect = "ask"

[[case]]
id = "r-a-grant-of-every-place"
goals = ["G6"]
intent = "every place below the root, granted by a path rule"
rules = ["allow rm", "allow :delete /**"]
command = "rm /etc/hosts"
expect = "allow"

[[case]]
id = "r-trailing-double-star-is-below-the-directory"
goals = ["G6"]
intent = "`build/**` grants what is below build, not build: a delete of the directory asks (Steven, 10-10)"
rules = ["allow rm *", "allow :delete build/**"]
command = "rm -rf build"
expect = "ask"

[[case]]
id = "r-a-directory-grant-covers-the-directory"
goals = ["G6"]
intent = "`build` alone is the directory and all below it"
rules = ["allow rm *", "allow :delete build"]
command = "rm -rf build"
expect = "allow"

[[case]]
id = "r-dot-double-star-never-covers-the-project"
goals = ["G6"]
intent = "`./**` is what is below the start, never the start"
rules = ["allow rm *", "allow :delete ./**"]
command = "rm -rf ."
expect = "ask"

[[case]]
id = "r-a-fence-reaches-the-rungs-above-it"
goals = ["G7"]
intent = "operations are a ladder: `deny :write` stops a delete there"
rules = ["allow *", "allow :* /**", "deny :write /etc"]
command = "rm /etc/x"
expect = "deny"

[[case]]
id = "r-a-fence-met-from-above-asks"
goals = ["G7"]
intent = "a directory above a fence asks, naming the rule: `rm -rf /` removes /etc with the rest"
rules = ["allow rm *", "allow :delete /", "deny rm /etc/**"]
command = "rm -rf /"
expect = "ask"

[[case]]
id = "r-a-glob-meets-a-guard-by-contact"
goals = ["Q5"]
intent = "a glob that could pick a credential asks (`~/.ss?` meets `~/.ssh`)"
rules = ["allow :read ~"]
command = "cat ~/.ss?/config"
expect = "ask"
by = "guard"

[[case]]
id = "r-a-glob-that-meets-no-guard-reads"
goals = ["Q5"]
intent = "the control: the same glob shape meeting no credential reads under the same grant — so contact is the reason above, not the outside (review stop 12, T8 M7)"
rules = ["allow :read ~"]
command = "cat ~/.zz?/config"
expect = "allow"
by = "rule"

[[case]]
id = "r-a-bare-glob-asks-the-cost"
goals = ["Q5"]
intent = "a bare `*` may pick a `.pem`: it asks — the precision cost of contact, measured in the replay"
rules = []
command = "ls *"
expect = "ask"

[[case]]
id = "r-a-credential-guard-is-lifted-by-the-file-rule"
goals = ["Q9"]
intent = "a rule naming the file lifts the shipped guard (users decide; what `A` proposes)"
rules = ["allow :read ~/.ssh/config"]
command = "cat ~/.ssh/config"
expect = "allow"

[[case]]
id = "r-no-allow-lifts-a-privilege-wrapper"
goals = ["Q8"]
intent = "a privilege wrapper is a hard ask under any allow"
rules = ["allow sudo *", "allow ls *"]
command = "sudo ls"
expect = "ask"

[[case]]
id = "r-a-privilege-wrapper-inside-an-argv"
goals = ["Q8"]
intent = "the hard ask holds inside an argv too (review 2026-10-10, A)"
rules = ["allow find *", "allow sudo *", "allow ls *"]
command = "find . -exec sudo ls \\;"
expect = "ask"

[[case]]
id = "r-an-unmodelled-flag-value-is-the-next-word"
goals = ["G4"]
intent = "a deny written `--context=prod*` meets `--context prod-east` (the next word is the value)"
rules = ["allow kubectl *", "deny kubectl --context=prod*"]
command = "kubectl --context prod-east get pods"
expect = "deny"

[[case]]
id = "r-a-one-letter-deny-meets-a-cluster"
goals = ["G4"]
intent = "without a model, `-k` meets `-sk` by contact"
rules = ["allow frob *", "deny frob -k"]
command = "frob -sk x"
expect = "deny"

[[case]]
id = "r-a-long-option-abbreviates"
goals = ["G4"]
intent = "GNU getopt takes a unique prefix: `--no` is `--no-preserve-root`, the shipped deny"
rules = ["allow rm *", "allow :delete /**"]
command = "rm -rf --no /"
expect = "deny"

[[case]]
id = "r-a-redirect-grant-unlocks-no-writer"
goals = ["G7"]
intent = "a grant of the redirect's target says nothing about what the program writes (review 2026-10-10, A)"
rules = ["allow :write /tmp/out"]
command = "git reset --hard > /tmp/out"
expect = "ask"

[[case]]
id = "r-a-shell-set-variable-is-unknown"
goals = ["Q5"]
intent = "`$_` is the last argument of the previous command, not a name the gate knows (review 2026-10-10, C)"
rules = []
command = "echo ~/.ssh/config; cat ${_:-README.md}"
expect = "ask"

[[case]]
id = "r-pwd-after-a-cd-is-not-the-gates"
goals = ["Q5"]
intent = "`$PWD` after a `cd` is where the line went (review 2026-10-10, E)"
rules = []
command = "cd ~/.ssh && cat $PWD/config"
expect = "ask"

[[case]]
id = "r-a-bracket-class-is-the-shells"
goals = ["Q5"]
intent = "`.[.]` is `..` to bash: placed nowhere (review 2026-10-10, A)"
rules = []
command = "cat .[.]/.ssh/config"
expect = "ask"

# ---- the second round (2026-10-10, E1 and E2) ------------------------------

[[case]]
id = "r2-a-handle-in-a-for-list-faces-a-human"
goals = ["Q8"]
intent = "the gate reads the text the executor expands: a handle the parser's fields dropped is still spent (E2)"
rules = []
command = "for x in {{tok.1a2b}}; do echo $x | tr a-z n-za-m; done"
expect = "ask"

[[case]]
id = "r2-an-assignment-only-stage-opens-its-redirection"
goals = ["G7"]
intent = "`X=1 > f` truncates f: the redirection is read with no command (E2)"
rules = []
command = "X=1 > /srv/notes.txt"
expect = "ask"

[[case]]
id = "r2-an-inner-xargs-reads-a-stream"
goals = ["Q5"]
intent = "a property of the stage's peel holds in every inner argv: `xargs` inside `find -exec` is unsound too (E1)"
rules = ["allow find *", "allow xargs *", "allow rm *"]
command = "cat list.txt | find . -maxdepth 0 -exec xargs rm \\;"
expect = "ask"

[[case]]
id = "r2-a-regex-deny-reaches-an-inner-program"
goals = ["G4"]
intent = "a `re:` deny reads an inner program as its own text (E1)"
rules = ["allow find *", "allow :delete build", "deny re:^rm( |$)"]
command = "find build/x -exec rm -r {} \\;"
expect = "deny"

[[case]]
id = "r2-a-derived-fence-reaches-the-inner-program"
goals = ["G7"]
intent = "a program rule's path words fence the inner program its form applied to (E1)"
rules = ["allow uv run *", "allow :delete /srv/out", "deny uv run rm /srv/out/keep/**"]
command = "uv run rm /srv/out/keep/a"
expect = "deny"

[[case]]
id = "r2-tar-create-writes-the-archive"
goals = ["G4"]
intent = "`tar -c` makes the archive `-f` names a write, the members stay reads: the `.git/hooks` guard meets it (E1)"
rules = ["allow tar *"]
command = "tar -cf .git/hooks/pre-commit notes.txt"
expect = "ask"

[[case]]
id = "r2-a-directory-flag-moves-the-program"
goals = ["G6"]
intent = "`git -C D` places its later words under D, as a `cd` would (E1)"
rules = ["allow git *", "allow :read /srv/out", "allow :delete build"]
command = "git -C /srv/out rm -r build"
expect = "ask"

[[case]]
id = "r2-a-redirection-is-offered-as-a-path-rule"
goals = ["Q9"]
intent = "the proposal for a redirect outside is `:write PATH`, never a grant to the program a later write would widen through (E2); here the rule it would propose, held"
rules = ["allow :write /srv/x"]
command = "cat notes.txt > /srv/x"
expect = "allow"

[[case]]
id = "r2-a-data-operand-narrows-the-rule"
goals = ["G4"]
intent = "an operand the model reads as data (a refspec) is carried as written even when it looks like a path: the rule names the branch (E2)"
rules = ["allow git push origin feature/x"]
command = "git push origin main"
expect = "ask"

[[case]]
id = "declared-value-is-the-flags"
goals = ["G4"]
intent = "`-l=` declares that an unmodelled program's flag takes a value, any value: the word after it is the flag's, not an argument the rule left out (Steven, 10-10)"
rules = ["allow mytool -l=|--language="]
command = "mytool --language rust"
expect = "allow"

[[case]]
id = "undeclared-value-is-an-argument"
goals = ["G4"]
intent = "without a declaration nothing says `-l` takes a value, so `rust` is an argument `allow mytool -l` did not name"
rules = ["allow mytool -l"]
command = "mytool -l rust"
expect = "ask"

[[case]]
id = "declared-value-is-still-a-place"
goals = ["G4", "G7"]
intent = "a declared value is still judged as a path wherever it could be one, so a wrong declaration costs a prompt and never hides a target"
rules = ["allow mytool -l="]
command = "mytool -l /srv/x/a"
expect = "ask"

[[case]]
id = "deny-every-value-of-a-flag"
goals = ["G4"]
intent = "`deny mytool -l=*` denies every value, under a blanket allow"
rules = ["allow mytool *", "deny mytool -l=*"]
command = "mytool -p -l rust"
expect = "deny"
