[package]
name = "shannon-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
blake3 = { workspace = true }
futures-util = { workspace = true }
regex = { workspace = true }
regex-automata = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
libc = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }

[features]
# Test doubles that must be reachable ACROSS a crate boundary, so `#[cfg(test)]`
# cannot gate them: `shannon-tui`'s tests drive the app against a backend that
# never finishes and a store that refuses to write. Off by default, so a
# production build of the binary cannot construct them even by accident.
#
# `CannedStub` is deliberately NOT here — it is production code (the no-API-key
# fallback, and the `stub` model).
test-util = []

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }
# Already the TUI's: capturing what core LOGS, so a scrub on a log sink is
# pinned by a test (full review 10-21, E 1).
tracing-subscriber = { workspace = true }

[[bench]]
name = "store_load"
harness = false
