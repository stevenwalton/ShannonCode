# Tokyo Night (Moon) — github.com/folke/tokyonight.nvim (Apache-2.0); see
# NOTICE.md. The palette's sixteen terminal colours and its ground: every
# role the shipped `terminal` theme paints is drawn in them.
inherits = "terminal"
"ui.background" = { fg = "text", bg = "base" }
comment = { fg = "comment", italic = true }
"ui.menu.selected" = { fg = "base", bg = "text" }
"ui.bar" = { fg = "base", bg = "cyan", bold = true }
"ui.bar.waiting" = { fg = "base", bg = "yellow", bold = true }
"ui.danger.sign" = { fg = "base", bg = "red", bold = true }
"ui.caution.fill" = { fg = "base", bg = "yellow" }
"ui.danger.fill" = { fg = "base", bg = "red", bold = true }
"ui.graph.mark" = { bg = "surface" }
"ui.graph.shared" = { fg = "comment", italic = true }

[palette]
base = "#222436"
text = "#c8d3f5"
comment = "#636da6"
surface = "#2d3f76"
black = "#1b1d2b"
red = "#ff757f"
green = "#c3e88d"
yellow = "#ffc777"
blue = "#82aaff"
magenta = "#c099ff"
cyan = "#86e1fc"
white = "#828bb8"
bright-black = "#444a73"
bright-red = "#ff8d94"
bright-green = "#c7fb6d"
bright-yellow = "#ffd8ab"
bright-blue = "#9ab8ff"
bright-magenta = "#caabff"
bright-cyan = "#b2ebff"
bright-white = "#c8d3f5"
