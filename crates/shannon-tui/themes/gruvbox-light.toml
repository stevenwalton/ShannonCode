# Gruvbox (light) — github.com/morhetz/gruvbox (MIT/X11); see NOTICE.md.
# The palette's sixteen terminal colours and its ground: every role the
# shipped `terminal` theme paints is drawn in them. A light theme: the
# roles the shipped theme paints white are its text instead.
inherits = "terminal"
"ui.background" = { fg = "text", bg = "base" }
comment = { fg = "comment", italic = true }
"ui.text" = "text"
"ui.statusline" = "text"
"ui.text.quiet" = "subtext"
"ui.muted" = "subtext"
"ui.border" = "subtext"
"decision.operator" = "subtext"
"decision.function.call" = { fg = "text", bold = true }
"ui.menu.selected" = { fg = "base", bg = "text" }
"ui.bar" = { fg = "base", bg = "cyan", bold = true }
"ui.bar.waiting" = { fg = "base", bg = "yellow", bold = true }
"ui.danger.sign" = { fg = "base", bg = "red", bold = true }
"ui.caution.fill" = { fg = "base", bg = "yellow" }
"ui.danger.fill" = { fg = "base", bg = "red", bold = true }
"ui.graph.mark" = { bg = "surface" }
"ui.graph.shared" = { fg = "comment", italic = true }

[palette]
base = "#fbf1c7"
text = "#3c3836"
subtext = "#7c6f64"
comment = "#928374"
surface = "#d5c4a1"
black = "#fbf1c7"
red = "#cc241d"
green = "#98971a"
yellow = "#d79921"
blue = "#458588"
magenta = "#b16286"
cyan = "#689d6a"
white = "#7c6f64"
bright-black = "#928374"
bright-red = "#9d0006"
bright-green = "#79740e"
bright-yellow = "#b57614"
bright-blue = "#076678"
bright-magenta = "#8f3f71"
bright-cyan = "#427b58"
bright-white = "#3c3836"
