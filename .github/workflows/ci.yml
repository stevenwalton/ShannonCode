# The gate `CONTRIBUTING.md` asks of a change, on every push to main and
# every pull request: fmt, clippy with warnings denied, the tests, the docs.
#
# Linux always; macOS only in the public repository, where its minutes are
# free (on a private one they cost ten times Linux's). The gate on a
# developer's machine is one OS: this is where the other one runs.
#
# Actions are pinned to a commit, not a tag (a tag can be moved); the tag is
# in the comment beside each.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  gate:
    name: gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.repository == 'stevenwalton/ShannonCode' && fromJSON('["ubuntu-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes: the token is not left in `.git/config`
          # for the steps after the checkout.
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-
      # The toolchain `rust-toolchain.toml` names, with rustfmt and clippy.
      - run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --workspace --no-fail-fast --locked
      - run: cargo doc --no-deps --workspace --locked
